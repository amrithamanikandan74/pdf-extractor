services:
  db:
    image: pgvector/pgvector:pg17
    container_name: pdf_pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdfdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: pdf_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Keep memory usage modest for local dev — raise this if extraction
      # over large document sets feels slow.
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_backend
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:?GROQ_API_KEY must be set}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-pdfdb}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      - API_KEY=${API_KEY:?API_KEY must be set}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-10485760}
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
      - SEARCH_BACKEND=${SEARCH_BACKEND:-pgvector}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=${ELASTICSEARCH_INDEX:-pdf_chunks}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite bakes these into the JS bundle at build time — they must be
      # build args, not the container's runtime `environment:` (which a
      # static nginx image never reads).
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_API_KEY: ${API_KEY:?API_KEY must be set}
    container_name: pdf_frontend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  esdata: