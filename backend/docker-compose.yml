version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: pdf_pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdfdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:?GROQ_API_KEY must be set}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-pdfdb}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - API_KEY=${API_KEY:?API_KEY must be set}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-10485760}
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # Vite bakes these into the JS bundle at build time — they must be
      # build args, not the container's runtime `environment:` (which a
      # static nginx image never reads).
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_API_KEY: ${API_KEY:?API_KEY must be set}
    container_name: pdf_frontend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata: